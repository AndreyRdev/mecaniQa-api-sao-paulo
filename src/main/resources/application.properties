spring.application.name=api

# MySQL: configure these environment variables before starting the application.
# Defaults are intended for a local development database.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mecaniqa?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
